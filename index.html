
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TONOLAB</title>
<style>
* { box-sizing: border-box; }
body {
  background: #101510;
  color: #9dff80;
  font-family: monospace;
  margin: 0;
  padding: 24px;
}
header {
  border-bottom: 2px solid #9dff80;
  padding-bottom: 15px;
}
h1 {
  font-size: clamp(30px, 8vw, 48px);
  letter-spacing: 8px;
  margin: 10px 0;
}
.screen {
  max-width: 800px;
  margin: 40px auto;
  border: 2px solid #9dff80;
  padding: 24px;
}
button {
  display: block;
  width: 100%;
  background: transparent;
  color: #9dff80;
  border: 1px solid #9dff80;
  padding: 16px;
  margin: 12px 0;
  font-family: monospace;
  font-size: 16px;
  cursor: pointer;
}
button:hover, button:focus-visible {
  background: #9dff80;
  color: #101510;
}
.status {
  animation: blink 1.5s infinite;
}
@keyframes blink {
  50% { opacity: 0.2; }
}
.blueprint {
  position: relative;
  background: #020502;
  border: 1px solid #438b43;
  margin: 20px 0;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  image-rendering: pixelated;
}
.blueprint::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,.22) 4px,
    rgba(0,0,0,.22) 5px
  );
}
footer {
  text-align: center;
  font-size: 12px;
  margin-top: 40px;
}
@media(max-width:600px) {
  body { padding: 12px; }
  .screen {
    padding: 14px;
    margin: 20px auto;
  }
}
@media(prefers-reduced-motion:reduce) {
  .status { animation: none; }
}
</style>
</head>
<body>

<header>
  TONOLAB // DRONE SYSTEM
</header>

<main class="screen">

<p class="status">● SYSTEM ONLINE</p>

<div class="blueprint">
<canvas id="drone" width="480" height="235"
aria-label="ドローンの設計図"></canvas>
</div>

<h1>TONOLAB</h1>

<p>DRONE &amp; CREATIVE TECHNOLOGY</p>
<p>空から、新しい可能性を。</p>

<hr>

<p>SELECT MENU</p>

<button onclick="show('ドローンによる空撮・映像制作')">
01 / SERVICE
</button>

<button onclick="show('ドローン活用に関するご相談')">
02 / PROJECT
</button>

<button onclick="show('TONOLAB — ドローン事業')">
03 / ABOUT US
</button>

<button onclick="show('お問い合わせ窓口 準備中')">
04 / CONTACT
</button>

<p id="message">AWAITING COMMAND...</p>

</main>

<footer>
© 2026 TONOLAB
</footer>

<script>
function show(message) {
  document.getElementById('message').textContent =
  '> ' + message;
}

const c = document.getElementById('drone');
const g = c.getContext('2d');

let t = 0;

const WHITE = '#c9d6c9';
const GREEN = '#439d48';
const BLACK = '#030603';

function line(points, color=WHITE, width=2, fill=false) {
  g.beginPath();
  points.forEach(([x,y],i) => {
    if(i) g.lineTo(x,y);
    else g.moveTo(x,y);
  });
  g.strokeStyle = color;
  g.lineWidth = width;
  if(fill) {
    g.fillStyle = BLACK;
    g.fill();
  }
  g.stroke();
}

function front(x,y,s,col) {
  g.save();
  g.translate(x,y);
  g.scale(s,s);

  line([
    [-22,-10],[22,-10],[32,0],
    [26,15],[-26,15],[-32,0],[-22,-10]
  ],col,2,true);

  for(const k of [-1,1]) {

    line([
      [k*30,1],[k*70,-7],[k*70,-17]
    ],col,4);

    line([
      [k*45,-19],[k*95,-19]
    ],col,2);

    let w = 10+15*Math.abs(Math.sin(t*.25));

    line([
      [k*70-w,-23],[k*70+w,-23]
    ],col,1);

    line([
      [k*20,15],[k*26,29],[k*42,29]
    ],col,2);
  }

  g.strokeStyle = col;
  g.strokeRect(-10,15,20,16);
  g.strokeRect(-5,19,10,8);

  g.restore();
}

function draw() {

  g.fillStyle = BLACK;
  g.fillRect(0,0,480,235);

  g.strokeStyle = '#287d32';
  g.lineWidth = 1;
  g.strokeRect(2,2,476,231);

  // GREEN GRID

  g.save();
  g.beginPath();
  g.rect(230,3,247,230);
  g.clip();

  for(let x=230;x<480;x+=15)
    line([[x,0],[x,235]],'#205829',1);

  for(let y=3;y<235;y+=15)
    line([[230,y],[480,y]],'#205829',1);

  g.restore();

  line([[230,2],[230,233]],'#287d32',1);

  // LEFT PANEL

  g.fillStyle = WHITE;
  g.font = 'bold 13px monospace';
  g.fillText('DRONE - SYSTEM -',14,23);

  front(115,65,.85,GREEN);

  g.font = '12px monospace';

  [
    '■ AERIAL IMAGING',
    '■ LIVE PRODUCTION',
    '■ INSPECTION',
    '■ FLIGHT SUPPORT'
  ].forEach((v,i) => {
    g.fillText(v,15,120+i*23);
  });

  // FRONT VIEW

  front(354,49,1.04,WHITE);

  // TOP VIEW

  const motors = [
    [290,126],
    [418,126],
    [290,193],
    [418,193]
  ];

  motors.forEach(([x,y],i) => {

    line([[354,160],[x,y]],WHITE,8);

    g.beginPath();
    g.arc(x,y,27,0,Math.PI*2);
    g.fillStyle = BLACK;
    g.fill();
    g.strokeStyle = WHITE;
    g.lineWidth = 1.5;
    g.stroke();

    let a = t*.16*(i%2===0?1:-1);

    line([
      [x+22*Math.cos(a),y+22*Math.sin(a)],
      [x-22*Math.cos(a),y-22*Math.sin(a)]
    ],WHITE,3);

    g.strokeRect(x-4,y-4,8,8);

  });

  // DRONE BODY

  line([
    [343,116],[365,116],[375,132],
    [375,190],[365,204],[343,204],
    [333,190],[333,132],[343,116]
  ],WHITE,2,true);

  g.strokeRect(345,135,18,47);
  g.strokeRect(346,105,16,12);

  // SCANNING LIGHT

  g.fillStyle = '#70ff7925';
  g.fillRect(231,3+(t*1.3)%224,246,5);

  t++;

  if(!window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches) {
    requestAnimationFrame(draw);
  }
}

draw();
</script>

</body>
</html>
